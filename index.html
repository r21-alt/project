<!DOCTYPE html>
<html lang="he" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חנות הטכנולוגיה | קטלוג מוצרים</title>
    
    <!-- Google Fonts - Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Glassmorphic Background Card */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Subtle Glow Effects */
        .glow-effect {
            position: relative;
        }
        .glow-effect::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899);
            border-radius: 1rem;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .glow-effect:hover::before {
            opacity: 1;
        }

        /* Custom Toast Notification */
        #toast {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(100px);
            opacity: 0;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Ambient Background Gradients -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-600/15 rounded-full blur-3xl"></div>
    </div>

    <header class="sticky top-0 z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    TechZone<span class="text-indigo-400">.</span>
                </span>
            </div>

            <!-- Header Quick Actions & Cart Indicator -->
            <div class="flex items-center gap-4">
                <button id="cartBtn" class="relative p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 hover:text-white border border-slate-700/60 transition-all duration-200 group">
                    <i class="fa-solid fa-cart-shopping text-lg group-hover:scale-110 transition-transform"></i>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900 shadow-md">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        
        <!-- Hero Header -->
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mb-4">
                <i class="fa-solid fa-sparkles text-xs"></i> מוצרים נבחרים 2026
            </span>
            <h1 class="text-4xl sm:text-5xl font-black text-white tracking-tight leading-tight mb-4">
                הדור הבא של הטכנולוגיה
            </h1>
            <p class="text-slate-400 text-base sm:text-lg font-normal leading-relaxed">
                גלה את מגוון המוצרים המתקדמים ביותר. איכות ללא פשרות, עיצוב מרהיב וביצועים עוצמתיים.
            </p>
        </div>

        <!-- Filter and Search Bar -->
        <div class="glass-card p-4 sm:p-5 rounded-2xl mb-10 shadow-xl flex flex-col md:flex-row gap-4 justify-between items-center">
            
            <!-- Search Input -->
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="חפש מוצר..." 
                    class="w-full pl-4 pr-11 py-2.5 bg-slate-900/80 border border-slate-700/70 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm transition-all">
            </div>

            <!-- Category / Sort Controls -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="sortSelect" class="bg-slate-900/80 border border-slate-700/70 text-slate-300 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 cursor-pointer w-full sm:w-auto">
                    <option value="default">מיון ברירת מחדל</option>
                    <option value="low-high">מחיר: מהנמוך לגבוה</option>
                    <option value="high-low">מחיר: מהגבוה לנמוך</option>
                </select>
            </div>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Product cards will be dynamically rendered or interactive here -->
        </div>

        <!-- Empty State Message -->
        <div id="noResults" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-5xl text-slate-600 mb-4"></i>
            <h3 class="text-xl font-bold text-slate-300">לא נמצאו מוצרים</h3>
            <p class="text-slate-500 text-sm mt-1">נסה לחפש במילים אחרות</p>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 z-50 glass-card bg-slate-900/90 border border-emerald-500/30 text-white px-5 py-4 rounded-2xl shadow-2xl flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-check text-sm"></i>
        </div>
        <div>
            <h4 class="font-bold text-sm text-slate-100" id="toastTitle">נוסף לסל בהצלחה!</h4>
            <p class="text-xs text-slate-400" id="toastMessage">המוצר תופס מקום בסל הקניות שלך</p>
        </div>
    </div>

    <footer class="relative z-10 border-t border-slate-800/80 bg-slate-950/80 py-8 text-center text-slate-500 text-sm">
        <div class="max-w-7xl mx-auto px-4">
            <p>© 2026 TechZone. כל הזכויות שמורות.</p>
        </div>
    </footer>

    <script>
        // Product Data Definition
        const products = [
            {
                id: 1,
                name: "מחשב נייד Pro",
                category: "computers",
                description: "מחשב נייד חזק, מהיר ומעוצב לעבודה ולגיימינג",
                price: 3500,
                tag: "מומלץ",
                tagColor: "bg-indigo-500/20 text-indigo-300 border-indigo-500/30",
                icon: "fa-laptop",
                rating: 4.9,
                reviews: 128
            },
            {
                id: 2,
                name: "טלפון חכם Ultra",
                category: "phones",
                description: "טלפון חכם מדגם חדש עם מצלמה מתקדמת",
                price: 2500,
                tag: "חדש",
                tagColor: "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
                icon: "fa-mobile-screen-button",
                rating: 4.8,
                reviews: 94
            },
            {
                id: 3,
                name: "אוזניות Premium",
                category: "audio",
                description: "אוזניות אלחוטיות עם מנגנון ביטול רעשים",
                price: 350,
                tag: "פופולרי",
                tagColor: "bg-pink-500/20 text-pink-300 border-pink-500/30",
                icon: "fa-headphones",
                rating: 4.7,
                reviews: 210
            },
            {
                id: 4,
                name: "מקלדת מכנית RGB",
                category: "accessories",
                description: "מקלדת מכנית איכותית עם תאורה מותאמת אישית",
                price: 280,
                tag: "מבצע",
                tagColor: "bg-amber-500/20 text-amber-300 border-amber-500/30",
                icon: "fa-keyboard",
                rating: 4.6,
                reviews: 76
            }
        ];

        let cartCount = 0;

        // Render Function
        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');

            if (items.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = items.map(product => `
                <div class="glass-card rounded-2xl p-6 flex flex-col justify-between hover:border-indigo-500/40 transition-all duration-300 hover:-translate-y-1 group relative overflow-hidden">
                    
                    <!-- Top Tag & Icon Badge -->
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${product.tagColor}">
                                ${product.tag}
                            </span>
                            <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-indigo-400 group-hover:scale-110 group-hover:bg-indigo-600 group-hover:text-white transition-all duration-300 shadow-md">
                                <i class="fa-solid ${product.icon} text-xl"></i>
                            </div>
                        </div>

                        <!-- Product Title & Info -->
                        <h3 class="text-lg font-bold text-white mb-2 group-hover:text-indigo-300 transition-colors">
                            ${product.name}
                        </h3>
                        <p class="text-slate-400 text-sm mb-4 leading-relaxed line-clamp-2">
                            ${product.description}
                        </p>
                    </div>

                    <!-- Rating & Price Section -->
                    <div>
                        <div class="flex items-center gap-1.5 mb-4 text-xs text-amber-400">
                            <i class="fa-solid fa-star"></i>
                            <span class="font-bold text-slate-200">${product.rating}</span>
                            <span class="text-slate-500">(${product.reviews})</span>
                        </div>

                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-slate-500 block">מחיר</span>
                                <span class="text-xl font-extrabold text-white">₪${product.price.toLocaleString()}</span>
                            </div>

                            <!-- Add to Cart Button -->
                            <button onclick="addToCart('${product.name}')" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-sm flex items-center gap-2 shadow-lg shadow-indigo-600/20 active:scale-95 transition-all">
                                <i class="fa-solid fa-cart-plus"></i>
                                <span>הוסף</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart Action
        function addToCart(productName) {
            cartCount++;
            const cartBadge = document.getElementById('cartCount');
            cartBadge.innerText = cartCount;
            
            // Pulse animation on cart button
            cartBadge.classList.add('scale-125');
            setTimeout(() => cartBadge.classList.remove('scale-125'), 200);

            // Trigger Toast
            showToast(productName);
        }

        // Show Toast Notification
        function showToast(productName) {
            const toast = document.getElementById('toast');
            document.getElementById('toastTitle').innerText = 'המוצר נוסף לסל!';
            document.getElementById('toastMessage').innerText = `${productName} נוסף בהצלחה`;

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Filter and Sort Logic
        function filterAndSortProducts() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortOption = document.getElementById('sortSelect').value;

            let filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchQuery) || 
                p.description.toLowerCase().includes(searchQuery)
            );

            if (sortOption === 'low-high') {
                filtered.sort((a, b) => a.price - b.price);
            } else if (sortOption === 'high-low') {
                filtered.sort((a, b) => b.price - a.price);
            }

            renderProducts(filtered);
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterAndSortProducts);
        document.getElementById('sortSelect').addEventListener('change', filterAndSortProducts);

        // Initial Render
        window.onload = function() {
            renderProducts(products);
        };
    </script>
</body>
</html>
