<!DOCTYPE html> <html lang="he" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Login</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        background: white;
        width: 100%;
        max-width: 400px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #667eea;
    }

    button {
        width: 100%;
        padding: 13px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #5568d9;
    }

    .forgot-password {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #667eea;
        text-decoration: none;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    .register {
        text-align: center;
        margin-top: 25px;
        color: #666;
    }

    .register a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head> <body>
<div class="login-container">
    <h1>התחברות</h1>

    <form action="/login" method="POST">

        <div class="form-group">
            <label for="email">אימייל</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="הכנס אימייל"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">סיסמה</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="הכנס סיסמה"
                required
            >
        </div>

        <button type="submit">התחבר</button>

    </form>

    <a href="#" class="forgot-password">
        שכחת סיסמה?
    </a>

    <div class="register">
        אין לך חשבון?
        <a href="#">הרשמה</a>
    </div>
</div>

</body> </html>
